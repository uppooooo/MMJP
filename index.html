<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MMO Database</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --border: #2a2a4a;
            --common: #b0b0b0;
            --uncommon: #4caf50;
            --rare: #2196f3;
            --epic: #9c27b0;
            --legendary: #ff9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ヘッダー */
        .header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        /* ページ切替タブ */
        .tab-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .tab-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .tab-btn:active {
            transform: scale(0.95);
        }

        /* 検索エリア */
        .search-area {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        /* ステータスバー */
        .status-bar {
            padding: 6px 16px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        /* ページコンテンツ */
        .page {
            display: none;
            padding: 0 12px 24px;
        }

        .page.active {
            display: block;
        }

        /* カード共通 */
        .card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .card:active {
            transform: scale(0.98);
        }

        /* ===== ドロップリスト用 ===== */
        .drop-card .monster-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .drop-card .item-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .drop-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rarity-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .rarity-common { background: rgba(176,176,176,0.2); color: var(--common); }
        .rarity-uncommon { background: rgba(76,175,80,0.2); color: var(--uncommon); }
        .rarity-rare { background: rgba(33,150,243,0.2); color: var(--rare); }
        .rarity-epic { background: rgba(156,39,176,0.2); color: var(--epic); }
        .rarity-legendary { background: rgba(255,152,0,0.2); color: var(--legendary); }

        .drop-rate {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .drop-rate strong {
            color: var(--text-primary);
        }

        .note {
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* ===== MIX公式DB用 ===== */
        .mix-card .core-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .mix-card .core-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .mix-card .core-info span {
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .mix-card .recipe {
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.75rem;
        }

        .mix-card .recipe-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .mix-card .recipe-label {
            color: var(--text-secondary);
        }

        .mix-card .recipe-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .mix-card .droppable {
            display: inline-block;
            background: rgba(76,175,80,0.2);
            color: var(--uncommon);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-left: 6px;
        }

        /* ===== 納品アイテムDB用 ===== */
        .delivery-card .category {
            font-size: 0.65rem;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .delivery-card .item-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .delivery-card .detail-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .delivery-card .detail-row span {
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* ローディング・空状態 */
        .loading, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* フッター */
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⚔️ MMO Database</h1>
        <div class="tab-bar">
            <button class="tab-btn active" data-page="drops">ドロップ</button>
            <button class="tab-btn" data-page="mix">MIX公式</button>
            <button class="tab-btn" data-page="delivery">納品アイテム</button>
        </div>
    </header>

    <div class="search-area">
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="検索..." autocomplete="off">
        </div>
    </div>

    <div class="status-bar">
        <span id="resultCount">読み込み中...</span>
        <span id="syncInfo"></span>
    </div>

    <!-- ドロップリスト -->
    <main class="page active" id="page-drops">
        <div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    </main>

    <!-- MIX公式DB -->
    <main class="page" id="page-mix">
        <div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    </main>

    <!-- 納品アイテムDB -->
    <main class="page" id="page-delivery">
        <div class="loading"><div class="spinner"></div><p>読み込み中...</p></div>
    </main>

    <footer class="footer">
        <p>Data synced from Google Spreadsheet via Firestore</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        // ===== Firebase設定 =====
        var firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // ===== データ管理 =====
        var appData = {
            drops: [],
            mix: [],
            delivery: []
        };
        var currentPage = 'drops';
        var currentSearch = '';

        // コレクション名とページの対応
        var COLLECTION_MAP = {
            drops: 'ドロップリスト',
            mix: 'MIX公式DB',
            delivery: '納品アイテムDB'
        };

        // ===== データ取得 =====
        async function fetchAllData() {
            try {
                var promises = Object.keys(COLLECTION_MAP).map(function(key) {
                    return db.collection(COLLECTION_MAP[key]).get().then(function(snapshot) {
                        appData[key] = snapshot.docs.map(function(doc) {
                            return Object.assign({ id: doc.id }, doc.data());
                        });
                    });
                });
                await Promise.all(promises);
                renderCurrentPage();
                fetchSyncInfo();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('resultCount').textContent = 'エラー: ' + error.message;
            }
        }

        async function fetchSyncInfo() {
            try {
                var doc = await db.collection('metadata').doc('last_sync').get();
                if (doc.exists) {
                    var data = doc.data();
                    var date = new Date(data.synced_at);
                    document.getElementById('syncInfo').textContent = '同期: ' + date.toLocaleDateString('ja-JP', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                }
            } catch (e) {}
        }

        // ===== フィルタリング =====
        function getFilteredItems(pageKey) {
            var items = appData[pageKey];
            if (!currentSearch) return items;

            var search = currentSearch.toLowerCase();
            return items.filter(function(item) {
                return Object.values(item).some(function(val) {
                    return String(val).toLowerCase().indexOf(search) !== -1;
                });
            });
        }

        // ===== レンダリング =====
        function renderCurrentPage() {
            var filtered = getFilteredItems(currentPage);
            document.getElementById('resultCount').textContent = filtered.length + '件';

            var container = document.getElementById('page-' + currentPage);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>該当データなし</p></div>';
                return;
            }

            switch (currentPage) {
                case 'drops': renderDrops(container, filtered); break;
                case 'mix': renderMix(container, filtered); break;
                case 'delivery': renderDelivery(container, filtered); break;
            }
        }

        function renderDrops(container, items) {
            container.innerHTML = items.map(function(item) {
                var rarityClass = 'rarity-' + (item.rarity || 'common').toLowerCase();
                return '<div class="card drop-card">' +
                    '<div class="monster-name">👾 ' + esc(item.monster_name || '') + '</div>' +
                    '<div class="item-name">' + esc(item.item_name || '') + '</div>' +
                    '<div class="meta">' +
                        '<span class="rarity-badge ' + rarityClass + '">' + esc(item.rarity || '') + '</span>' +
                        '<span class="drop-rate">Drop: <strong>' + (item.drop_rate || '?') + '%</strong></span>' +
                    '</div>' +
                    (item.note ? '<div class="note">📝 ' + esc(item.note) + '</div>' : '') +
                '</div>';
            }).join('');
        }

        function renderMix(container, items) {
            container.innerHTML = items.map(function(item) {
                var dropBadge = item['Drop可'] === '〇' ? '<span class="droppable">Drop可</span>' : '';
                var mixLv = item['MIX Lv'] || item['MIX_Lv'] || '-';
                return '<div class="card mix-card">' +
                    '<div class="core-name">' + esc(item['コア名'] || '') + dropBadge + '</div>' +
                    '<div class="core-info">' +
                        '<span>種族: ' + esc(item['種族'] || '') + '</span>' +
                        '<span>Lv: ' + (item['基本Lv'] || item['基本_Lv'] || '-') + '</span>' +
                        '<span>MIX Lv: ' + mixLv + '</span>' +
                    '</div>' +
                    (mixLv !== '-' ? '<div class="recipe">' +
                        '<div class="recipe-row"><span class="recipe-label">メインコア</span><span class="recipe-value">' + esc(item['メインコア'] || '') + ' (EC' + (item['メインEC'] || '-') + ')</span></div>' +
                        '<div class="recipe-row"><span class="recipe-label">サブコア</span><span class="recipe-value">' + esc(item['サブコア'] || '') + ' (EC' + (item['サブEC'] || '-') + ')</span></div>' +
                    '</div>' : '') +
                '</div>';
            }).join('');
        }

        function renderDelivery(container, items) {
            container.innerHTML = items.map(function(item) {
                return '<div class="card delivery-card">' +
                    '<div class="category">' + esc(item['大分類'] || '') + '</div>' +
                    '<div class="item-name">' + esc(item['アイテム名'] || '') + '</div>' +
                    '<div class="detail-row">' +
                        '<span>個数: ' + (item['個数'] || '-') + '</span>' +
                        '<span>MAP: ' + esc(item['マップ'] || '-') + '</span>' +
                        '<span>MOB: ' + esc(item['モンスター'] || '-') + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        // XSS対策
        function esc(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ===== イベント =====

        // タブ切替
        document.querySelector('.tab-bar').addEventListener('click', function(e) {
            var btn = e.target.closest('.tab-btn');
            if (!btn) return;

            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');

            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            currentPage = btn.dataset.page;
            document.getElementById('page-' + currentPage).classList.add('active');

            renderCurrentPage();
        });

        // 検索
        var searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                currentSearch = e.target.value.trim();
                renderCurrentPage();
            }, 200);
        });

        // ===== 初期化 =====
        fetchAllData();
    </script>
</body>
</html>
